services:
  db:
    volumes:
      - postgres_data_prod:/var/lib/postgresql

  seaweed-master:
    volumes:
      - seaweed_data_master_prod:/data

  seaweed-volume:
    volumes:
      - seaweed_data_volume_prod:/data

  seaweed-filer:
    volumes:
      - seaweed_data_filer_prod:/data

  seaweed-s3:
    tmpfs:
      - /data

  redis-queue:
    command: redis-server --appendonly yes --maxmemory ${REDIS_QUEUE_MAX_MEMORY} --requirepass ${REDIS_QUEUE_PASSWORD}
    volumes:
      - redis_queue_data_prod:/data

  db-prepare:
    env_file: 
      - .env

  backend:
    env_file: 
      - .env

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data_prod:
  seaweed_data_master_prod:
  seaweed_data_volume_prod:
  seaweed_data_filer_prod:
  redis_queue_data_prod: