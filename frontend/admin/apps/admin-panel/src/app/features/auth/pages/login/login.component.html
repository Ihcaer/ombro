<app-auth-wrapper icon="login">
  <ng-container heading>Logowanie</ng-container>
  <ng-container>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      @if (getErrorMessage(); as message) {
        <div class="mb-(--p-spacing-4) flex items-center justify-center">
          <p-message severity="error" styleClass="min-w-0">
            <span class="text-wrap">
              {{ message }}
            </span>
          </p-message>
        </div>
      }
      <div>
        <div class="form-fields">
          <ombro-input-text
            label="Nazwa użytkownika lub e-mail"
            autocomplete="username"
            formControlName="login"
            (keydown.space)="$event.preventDefault()"
          />
          <ombro-input-text
            label="Hasło"
            type="password"
            autocomplete="current-password"
            formControlName="password"
          />
        </div>
        <!-- <div class="mt-(--p-spacing-2) text-right"><a>Nie pamiętasz hasła?</a></div> -->
      </div>
      <app-auth-form-buttons>Zaloguj się</app-auth-form-buttons>
    </form>
  </ng-container>
</app-auth-wrapper>
