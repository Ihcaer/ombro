<div
  [class]="isSideMenuCollapsed() ? 'grid-cols-[4.25rem_1fr]' : 'grid-cols-[13.5rem_1fr]'"
  class="layout transition-grid-cols grid h-dvh w-screen grid-rows-[6.25rem_1fr] gap-x-(--p-custom-semantic-surface-primary-gap-horizontal) gap-y-(--p-custom-semantic-surface-primary-gap-vertical) p-(--p-custom-semantic-surface-primary-padding) duration-(--transition-duration) ease-out"
>
  <ng-container>
    <app-panel-layout-sidebar [(isCollapsed)]="isSideMenuCollapsed" class="row-span-full" />
  </ng-container>
  <div class="flex flex-col justify-between">
    <app-panel-layout-topbar />
    <ombro-breadcrumb />
  </div>
  <main><router-outlet /></main>
</div>
<app-panel-session-expired-modal [(isVisible)]="isDialogOpen" (onClose)="onDialogClose()" />
