<nav
  class="p-(--p-spacing-4) rounded-(--p-radius-xl)"
  [aria-label]="ariaLabel()"
  *transloco="let t"
>
  <div class="gap-(--p-spacing-1-5) flex flex-col">
    <span class="text-(--p-primary-100) text-(length:--p-size-14) font-(--p-font-weight-600)">
      {{ displayName() ?? '' }}
    </span>
    <span class="text-(--p-muted-blue-300) text-(length:--p-size-12)">
      {{ handleName() !== null ? '@' + handleName() : '' }}
    </span>
  </div>
  <ul class="mt-(--p-spacing-3) gap-(--p-spacing-1) flex flex-col">
    @for (item of navItems; track $index) {
      <li>
        @if (item.path) {
          <a [routerLink]="item.path" class="menu-item item">
            <ng-container
              *ngTemplateOutlet="itemTemplate; context: { $implicit: t, menuItem: item }"
            />
          </a>
        } @else if (item.action) {
          <button (click)="item.action()" class="menu-item item">
            <ng-container
              *ngTemplateOutlet="itemTemplate; context: { $implicit: t, menuItem: item }"
            />
          </button>
        } @else {
          <div class="menu-item">
            <ng-container
              *ngTemplateOutlet="itemTemplate; context: { $implicit: t, menuItem: item }"
            />
          </div>
        }
      </li>
    }
  </ul>
</nav>

<ng-template #itemTemplate let-t let-item="menuItem">
  @if (item.icon) {
    <ombro-icon [name]="item.icon" [size]="20" class="text-(--p-muted-blue-300)" />
  }
  <span class="text-(length:--p-size-13) text-(--p-primary-100)">{{ t(item.name) }}</span>
</ng-template>
