server {
   listen 80;

   set $site_folder /admin;

   root /usr/share/nginx/html$site_folder;
   index index.html;

   location / {
   try_files $uri $uri/ /index.html;
   }

   location ~* \.(js|css|png|jpg|jpeg|svg|gif|ico|webp|avif)$ {
      add_header Cache-Control "public, max-age=2592000, immutable";
      log_not_found off;
      try_files $uri =404;
   }
}