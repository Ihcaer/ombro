<div class="checkbox-container">
  <div class="checkbox-input">
    <p-checkbox
      [inputId]="inputId"
      [disabled]="isDisabled()"
      [ngModel]="value()"
      (ngModelChange)="handleCheckboxChange($event)"
      [binary]="binary()"
      [disabled]="isDisabled()"
      (onBlur)="handleBlur()"
      [class.p-invalid]="!!errorState()"
    />
    @if (label()) {
      <ombro-input-label [inputId]="inputId">{{ label() }}</ombro-input-label>
    }
  </div>
  <ombro-input-error-message [errorMessage]="errorState()" />
</div>
