<div class="container">
  @if (label()) {
    <ombro-input-label [inputId]="inputId" [disabled]="isDisabled()" [iconName]="labelIcon()">{{
      label()
    }}</ombro-input-label>
  }
  @if (type() === 'password') {
    <p-password
      [id]="inputId"
      [feedback]="false"
      [disabled]="isDisabled()"
      [toggleMask]="true"
      [autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [invalid]="!!errorState()"
      [ngModel]="value()"
      (ngModelChange)="onInput($event)"
      (onBlur)="handleBlur()"
      fluid
    />
  } @else {
    <input
      pInputText
      [id]="inputId"
      [type]="type()"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInputFromEvent($event)"
      (blur)="handleBlur()"
      [autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [invalid]="!!errorState()"
    />
  }
  @if (errorState(); as message) {
    <small>{{ message }}</small>
  }
</div>
