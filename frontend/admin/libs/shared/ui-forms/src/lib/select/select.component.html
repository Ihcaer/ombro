<div class="container">
  @if (label()) {
    <ombro-input-label
      [inputId]="''"
      [id]="labelId"
      [disabled]="isDisabled()"
      [iconName]="labelIcon()"
      [attr.inert]="isDisabled() ? '' : null"
      (click)="select.focus(); select.show()"
      (mouseenter)="isLabelHovered.set(true)"
      (mouseleave)="isLabelHovered.set(false)"
      >{{ label() }}</ombro-input-label
    >
  }
  <p-select
    #select
    [ariaLabelledBy]="labelId"
    [options]="options()"
    [ngModel]="value()"
    (ngModelChange)="handleSelectChange($event)"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [showClear]="showClear()"
    [virtualScroll]="virtualScroll()"
    [virtualScrollItemSize]="virtualScrollItemSize()"
    [class.force-hover]="isLabelHovered()"
    (onBlur)="onTouched()"
  />
</div>
