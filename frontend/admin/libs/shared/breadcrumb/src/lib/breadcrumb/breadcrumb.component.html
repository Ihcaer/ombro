<p-breadcrumb [model]="references()" [pt]="{ root: { 'aria-label': navAriaLabel() } }">
  <ng-template #item let-item>
    @if (item.id === 'home' && item.current) {
      <ng-container [ngTemplateOutlet]="homeIcon" />
    } @else if (item.id === 'home') {
      <a [routerLink]="item.url" class="p-breadcrumb-item-link">
        <ng-container [ngTemplateOutlet]="homeIcon" />
      </a>
    } @else if (item.current) {
      <span aria-current="page" class="leading-none">
        <ng-container [ngTemplateOutlet]="defaultItem" [ngTemplateOutletContext]="{ data: item }" />
      </span>
    } @else {
      <a [routerLink]="item.url" class="p-breadcrumb-item-link">
        <ng-container [ngTemplateOutlet]="defaultItem" [ngTemplateOutletContext]="{ data: item }" />
      </a>
    }
  </ng-template>
  <ng-template #separator>{{ separatorItem() }}</ng-template>
</p-breadcrumb>

<ng-template #homeIcon>
  <div class="p-breadcrumb-item-label home-label"><ombro-icon name="home" [size]="15" /></div>
</ng-template>
<ng-template #defaultItem let-item="data">
  <span class="p-breadcrumb-item-label">{{ item.label }}</span>
</ng-template>
