<div class="container">
  @if (label()) {
    <ombro-input-label
      [inputId]="inputId"
      [disabled]="isDisabled()"
      [iconName]="labelIcon()"
      [attr.inert]="isDisabled() ? '' : null"
      >{{ label() }}</ombro-input-label
    >
  }
  @if (type() === 'password') {
    <p-iconfield>
      <input
        pInputPassword
        [id]="inputId"
        class="w-full"
        [type]="type()"
        [value]="value()"
        [disabled]="isDisabled()"
        (input)="onInput($event)"
        (blur)="handleBlur()"
        [autocomplete]="autocomplete()"
        [placeholder]="placeholder()"
        [invalid]="!!errorState()"
        [mask]="mask()"
      />
      <p-inputicon (click)="mask.update((v) => !v)" class="cursor-pointer">
        <ombro-icon [name]="mask() ? 'visibility' : 'visibility_off'" [size]="16" />
      </p-inputicon>
    </p-iconfield>
  } @else {
    <input
      pInputText
      [id]="inputId"
      [type]="type()"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInput($event)"
      (blur)="handleBlur()"
      [autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [invalid]="!!errorState()"
    />
  }
  <ombro-input-error-message [errorMessage]="errorState()" />
  @if (type() === 'password' && showPasswordStrength()) {
    <div class="mb-[1rem]">
      <div class="flex justify-between">
        <span class="text-(--p-text-color-emphasis)">Siła hasła</span>
        <span [ngClass]="'strength-message-' + actualPasswordStrengthScore()">
          {{ passwordStrengthMessage() }}
        </span>
      </div>
      <p-progressbar
        class="h-[0.5rem]"
        [ngClass]="'strength-bar-' + actualPasswordStrengthScore()"
        [value]="actualPasswordPercentageStrength()"
        [showValue]="false"
      />
    </div>
  }
</div>
