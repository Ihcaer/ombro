<div class="container">
  @if (label()) {
    <ombro-input-label
      [inputId]="inputId"
      [disabled]="isDisabled()"
      [iconName]="labelIcon()"
      [attr.inert]="isDisabled() ? '' : null"
      (click)="onLabelClick()"
      (mouseenter)="isLabelHovered.set(true)"
      (mouseleave)="isLabelHovered.set(false)"
      >{{ label() }}</ombro-input-label
    >
  }
  @if (type() === 'password') {
    <p-password
      #passwordInput
      [id]="inputId"
      [feedback]="false"
      [disabled]="isDisabled()"
      [toggleMask]="true"
      [autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [invalid]="!!errorState()"
      [ngModel]="value()"
      (ngModelChange)="onInput($event)"
      (onBlur)="handleBlur()"
      [class.force-hover]="isLabelHovered()"
      fluid
    />
  } @else {
    <input
      pInputText
      [id]="inputId"
      [type]="type()"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInputFromEvent($event)"
      (blur)="handleBlur()"
      [autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [invalid]="!!errorState()"
    />
  }
  <ombro-input-error-message [errorMessage]="errorState()" />
  @if (type() === 'password' && showPasswordStrength()) {
    <div class="mb-[1rem]">
      <div class="flex justify-between">
        <span class="text-(--p-text-color-emphasis)">Siła hasła</span>
        <span [ngClass]="'strength-message-' + actualPasswordStrengthScore()">
          {{ passwordStrengthMessage() }}
        </span>
      </div>
      <p-progressbar
        class="h-[0.5rem]"
        [ngClass]="'strength-bar-' + actualPasswordStrengthScore()"
        [value]="actualPasswordPercentageStrength()"
        [showValue]="false"
      />
    </div>
  }
</div>
