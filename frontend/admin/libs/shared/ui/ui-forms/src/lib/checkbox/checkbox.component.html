<div class="checkbox-container">
  <div class="checkbox-input">
    <p-checkbox
      [inputId]="inputId"
      [disabled]="disabled()"
      [ngModel]="checked()"
      (ngModelChange)="checked.set($event)"
      [binary]="binary()"
      (onBlur)="touch.emit()"
      [class.p-invalid]="errorState()"
    />
    @if (label()) {
      <ombro-input-label [inputId]="inputId">{{ label() }}</ombro-input-label>
    }
  </div>
  <ombro-input-error-message [errorMessage]="errorState()" />
</div>
