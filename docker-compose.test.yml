services:     
  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "8025:8025"
    networks:
      - mailpit_net
    
  backend:
    env_file:
      - ".env.test"
    networks:
      - mailpit_net

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro

networks:
  mailpit_net: