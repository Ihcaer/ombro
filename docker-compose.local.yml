services:
  db:
    volumes:
      - postgres_data_local:/var/lib/postgresql

  seaweed-master:
    volumes:
      - seaweed_data_master_local:/data
  
  seaweed-volume:
    volumes:
      - seaweed_data_volume_local:/data

  seaweed-filer:
    volumes:
      - seaweed_data_filer_local:/data

  seaweed-s3:
    tmpfs:
      - /data

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data_local:/data
    networks:
      - mailpit_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${EMAIL_HOST}:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true

  db-prepare:
    env_file: 
      - ".env.local"
  
  backend:
    env_file: 
      - ".env.local"
    networks:
      - mailpit_net
    depends_on:
      mailpit:
        condition: service_healthy

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro

networks:
  mailpit_net:

volumes:
  postgres_data_local:
  seaweed_data_master_local:
  seaweed_data_volume_local:
  seaweed_data_filer_local:
  mailpit_data_local: